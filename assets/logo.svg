<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Veltrum">
  <title>Veltrum</title>
  <!-- Rounded forest-green tile -->
  <rect width="100" height="100" rx="22" fill="#275749"/>
  <!-- Single automation arc, sweeping clockwise toward the top -->
  <path d="M 78.1 36.9 A 31 31 0 1 1 50 19"
        fill="none" stroke="#FFFFFF" stroke-width="7.5" stroke-linecap="round"/>
  <!-- Arrowhead at the top, pointing in the direction of rotation -->
  <path d="M 48 8 L 67 19 L 48 30 Z" fill="#FFFFFF"/>
  <!-- Solid bright center circle -->
  <circle cx="50" cy="50" r="13.5" fill="#67D073"/>
</svg>
